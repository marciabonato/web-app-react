<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Nordic Nest | Home & Design</title>
    <script type="text/javascript">
      // ----------------------------------------------------------------------
      // Redirecionamento SPA para GitHub Pages (Single Page Apps no GitHub Pages)
      // Mantém rotas e query params redirecionando para index.html com query string
      // ----------------------------------------------------------------------
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
